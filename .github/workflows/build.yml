name: Build and verify browse binaries

on:
  workflow_call:
    inputs:
      upstream_tag:
        required: true
        type: string
      targets:
        type: string
        default: '[{"os":"macos-15","target":"darwin-arm64"},{"os":"ubuntu-24.04","target":"linux-x86_64"}]'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone and patch exact stable upstream source
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --quiet --depth 1 --branch "$UPSTREAM_TAG" --single-branch https://github.com/vercel-labs/agent-browser.git upstream
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('upstream/cli/Cargo.toml').read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          assert version and version.group(1) == os.environ['UPSTREAM_TAG'][1:], 'tag/manifest mismatch'
          PY
          python3 scripts/patch_upstream.py upstream
          cargo fmt --manifest-path upstream/cli/Cargo.toml --all
          cargo fmt --manifest-path upstream/cli/Cargo.toml --all -- --check
          PATCHED_UPSTREAM_ROOT="$PWD/upstream" python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: upstream/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the embedded dashboard
        working-directory: upstream
        run: |
          pnpm install --frozen-lockfile --filter dashboard
          pnpm --filter dashboard build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/cli -> target
          key: browse-${{ matrix.target }}-v3
      - name: Build and run Rust unit tests
        run: |
          set -euo pipefail
          cargo build --manifest-path upstream/cli/Cargo.toml --locked --profile ci --jobs 2
          python3 scripts/run_upstream_tests.py upstream
      - name: Smoke test browser defaults and explicit overrides
        run: python3 scripts/smoke.py upstream/cli/target/ci/agent-browser --version "${UPSTREAM_TAG#v}"
      - name: Verify architecture, sign macOS binary, and package
        run: python3 scripts/package.py "${{ matrix.target }}" "$UPSTREAM_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/agent-browser-browse-${{ matrix.target }}.tar.gz
          if-no-files-found: error
