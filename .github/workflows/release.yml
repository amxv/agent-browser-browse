name: Track upstream and release macOS and Linux browse binaries

on:
  schedule:
    - cron: '19 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional stable upstream tag (blank = latest stable)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: browse-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      targets: ${{ steps.upstream.outputs.targets }}
    steps:
      - name: Find missing platform assets
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/vercel-labs/agent-browser/releases/latest --jq .tag_name)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid upstream tag' >&2; exit 1; }
          gh api "repos/vercel-labs/agent-browser/releases/tags/$tag" --jq 'select(.draft == false and .prerelease == false) | .tag_name' > stable-tag.txt
          test "$(cat stable-tag.txt)" = "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
          else
            : > existing-assets.txt
          fi
          python3 - <<'PY'
          import json, os, pathlib
          assets = set(pathlib.Path('existing-assets.txt').read_text().splitlines())
          targets = [
              {'os': 'macos-15', 'target': 'darwin-arm64'},
              {'os': 'ubuntu-24.04', 'target': 'linux-x86_64'},
          ]
          if any(name.endswith('.tar.gz') for name in assets) and 'SHA256SUMS' not in assets:
              raise SystemExit('Existing release is missing SHA256SUMS; repair the manifest before adding assets.')
          missing = [item for item in targets if f'agent-browser-browse-{item["target"]}.tar.gz' not in assets]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('targets=' + json.dumps(missing, separators=(',', ':')) + '\n')
          print('Missing platform assets:', missing)
          PY

  build:
    needs: check
    if: needs.check.outputs.targets != '[]'
    uses: ./.github/workflows/build.yml
    with:
      upstream_tag: ${{ needs.check.outputs.tag }}
      targets: ${{ needs.check.outputs.targets }}

  publish:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Preserve existing assets and publish verified additions
        run: |
          set -euo pipefail
          mkdir -p previous
          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > previous/assets.txt
            gh release download "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir previous
          else
            : > previous/assets.txt
          fi
          python3 scripts/merge_sums.py previous/SHA256SUMS previous/assets.txt dist
          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Publish the manifest first: if an archive upload then fails, its
            # missing asset is detected and retried on the next scheduled run.
            gh release upload "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/SHA256SUMS
            gh release upload "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz
          else
            gh release create "$UPSTREAM_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Browse build ${UPSTREAM_TAG#v} (macOS ARM64 and Linux x86_64)" \
              --notes 'Unofficial patched agent-browser with stable Chrome defaults, version-aware headless user-agent, Runtime.disable after initialization, and a 15-minute idle timeout. Includes the upstream dashboard. No bot-detection guarantees; console/page-error streaming is limited. See README for measured platform results and limitations.'
          fi
