name: Track upstream and release cross-platform browse binaries

on:
  schedule:
    - cron: '19 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional upstream tag, e.g. v0.41.1 (blank = latest stable)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: browse-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      targets: ${{ steps.upstream.outputs.targets }}
    steps:
      - name: Detect missing platform assets for upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/vercel-labs/agent-browser/releases/latest --jq .tag_name)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid upstream tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
          else
            : > existing-assets.txt
          fi
          python3 - <<'PY'
          import json, os, pathlib
          assets = set(pathlib.Path("existing-assets.txt").read_text().splitlines())
          targets = [
              {"os": "macos-15", "target": "darwin-arm64"},
              {"os": "ubuntu-24.04", "target": "linux-x86_64"},
              {"os": "windows-2025", "target": "windows-x86_64"},
          ]
          missing = [t for t in targets if f'agent-browser-browse-{t["target"]}.tar.gz' not in assets]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("targets=" + json.dumps(missing, separators=(",", ":")) + "\n")
          print("Missing platform targets:", missing)
          PY

  build:
    needs: check
    if: needs.check.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/cli -> target
          key: browse-${{ matrix.target }}-v2
      - name: Clone release source and apply strict patch
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$UPSTREAM_TAG" --single-branch https://github.com/vercel-labs/agent-browser.git upstream
          python - "$UPSTREAM_TAG" <<'PY'
          import pathlib, re, sys
          source = (pathlib.Path("upstream") / "cli/Cargo.toml").read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', source, re.M)
          assert version and version.group(1) == sys.argv[1][1:], "tag/manifest version mismatch"
          PY
          python scripts/patch_upstream.py upstream
          cargo fmt --manifest-path upstream/cli/Cargo.toml --all
          cargo fmt --manifest-path upstream/cli/Cargo.toml --all -- --check
      - name: Build patched CLI (no publishing in this job)
        run: cargo build --manifest-path upstream/cli/Cargo.toml --locked --profile ci --jobs 3
      - name: Test headless default browser on loopback only
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; else suffix=; fi
          python scripts/smoke.py "upstream/cli/target/ci/agent-browser$suffix"
      - name: Package verified executable
        run: python scripts/package.py "${{ matrix.target }}" "$UPSTREAM_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/agent-browser-browse-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Merge checksums from existing release, then attach new assets
        run: |
          set -euo pipefail
          mkdir -p previous
          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > previous/assets.txt
            gh release download "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir previous
          else
            : > previous/assets.txt
          fi
          python3 scripts/merge_sums.py previous/SHA256SUMS previous/assets.txt dist
          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz
            gh release upload "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/SHA256SUMS
          else
            gh release create "$UPSTREAM_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Browse build ${UPSTREAM_TAG#v} (macOS, Linux, Windows)" \
              --notes "Unofficial patched agent-browser. Runtime.disable after initialization and version-aware Chrome launch defaults. No detection guarantees; console/page-error streaming impaired. See README."
          fi
